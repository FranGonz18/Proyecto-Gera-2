<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            align-items: center;
            background: {{ configuracion.color_fondo | default("#f7fbfb") }};
            color: {{ configuracion.color_texto | default("#263238") }};
            display: flex;
            min-height: 100vh;
            justify-content: center;
        }

        .login-card {
            background: {{ configuracion.color_tarjeta | default("#ffffff") }};
            border: 1px solid {{ configuracion.color_borde | default("#d8eeee") }};
            border-radius: 10px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
        }

        input {
            background: {{ configuracion.color_tarjeta | default("#ffffff") }} !important;
            border: 1px solid {{ configuracion.color_borde | default("#d8eeee") }} !important;
            color: {{ configuracion.color_texto | default("#263238") }} !important;
            border-radius: 8px !important;
            padding: 10px;
        }

        .btn-primary {
            background: {{ configuracion.color_primario | default("#10aaa5") }};
            border: none;
        }

        .login-logo {
            display: block;
            margin: 0 auto 16px;
            max-height: 126px;
            max-width: 126px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img class="login-logo" src="{{ url_for('static', filename=configuracion.logo_app | default('logo.png')) }}" alt="{{ configuracion.nombre_app | default('Espacio Arte Academia') }}">
        <h3 class="mb-1">{{ configuracion.nombre_app | default("Espacio Arte Academia") }}</h3>
        <p class="text-muted mb-4">Ingresar al sistema</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label>Usuario</label>
            <input name="nombre" class="form-control mb-3" required autofocus>

            <label>Contraseña</label>
            <input type="password" name="password" class="form-control mb-4" required>

            <button class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</body>
</html>
